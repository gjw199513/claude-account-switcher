name: CI
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the sync and switch logic
        run: python3 -m unittest discover -s tests -v
      - name: Check the native interface and scripts
        run: |
          swiftc -parse-as-library -typecheck App.swift DesktopUsage.swift
          swiftc -parse-as-library DesktopUsage.swift tests/DesktopUsageTests.swift -o "$RUNNER_TEMP/desktop-usage-tests"
          "$RUNNER_TEMP/desktop-usage-tests"
          bash -n install.sh uninstall.sh
          python3 -m json.tool assets/translations.json >/dev/null
